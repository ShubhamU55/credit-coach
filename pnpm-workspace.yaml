packages:
  - 'apps/*'
  - 'packages/*'
  - '.claude/hooks'

allowBuilds:
  sharp: false
  unrs-resolver: false
  '@parcel/watcher': false

# Expo/React Native native builds on Windows hit CMake path limits under the isolated .pnpm layout.
nodeLinker: hoisted

# Dated allow-list for `pnpm audit --audit-level=high` (G5). Only add an entry
# when a finding forces it and no patched version exists; re-review on the
# date noted below and drop the entry once a fix ships.
auditConfig:
  ignoreGhsas:
    # node-forge RSA PKCS#1 v1.5 signature check; no patch available;
    # transitive via apps/mobile expo/@expo/cli. Added 2026-10-21, re-review by 2026-11-21.
    - GHSA-86w9-cpqp-85rv
    # braces ReDoS via deeply nested patterns; no patch available;
    # transitive via metro/eslint-config-next. Added 2026-10-21, re-review by 2026-11-21.
    - GHSA-vfj7-8cjw-p6xm

# Transitive zod@3 (via apps/mobile expo/@expo/cli, which pins ^3.25.76) is
# vulnerable to GHSA-mrhx-c7xc-m3w5 (memory exhaustion on oversized constrained
# collections); only zod >=4.6.6 is patched. Scoped to the vulnerable range so
# already-patched zod 4 consumers are untouched. @expo/cli uses only basic zod
# APIs (object/enum/string/array) for its MCP devtools schema, dev-time only.
# Added 2026-10-27; drop once @expo/cli ships with a patched zod.
overrides:
  'zod@<4.6.6': '^4.6.6'
