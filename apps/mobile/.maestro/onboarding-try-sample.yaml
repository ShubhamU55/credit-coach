appId: com.creditcoach.app
---
# Welcome -> "Try sample profile" -> Home with the Aarav numbers (docs/design.md section 8).
# No typing anywhere. The Plan, Score and Mark as paid steps belong to PD-9 and PD-10.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 20000
- assertVisible: 'Try sample profile'
- assertVisible: 'No sign-up · 10 seconds'
- tapOn:
    id: 'welcome-try-sample'

# Home: top of the screen
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 10000
- assertVisible: 'Aarav, one payment keeps you on track.'
- assertVisible:
    id: 'hero-card'
- assertVisible: '₹12,400'

# Home: overall utilization 45.0% and the estimate range
- scrollUntilVisible:
    element:
      id: 'home-stat-utilization'
- assertVisible: '45.0%'
- assertVisible: '708–736'

# Home: the disclaimer closes the screen
- scrollUntilVisible:
    element:
      id: 'disclaimer'
- assertVisible: 'Estimates only. Not your official CIBIL score. Not financial advice.'
