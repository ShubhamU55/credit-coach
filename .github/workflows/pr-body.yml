name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# The check reads the PR description from the event payload; it needs the repo only to run the script.
permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: pr-body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require the AI-assisted disclosure and a verify result
        run: node .claude/hooks/bin/pr-body-check.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      # docs/ai-policy.md: aim for at most about 400 changed lines. A warning, not a failure.
      - name: Warn when the PR is over 400 changed lines
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          changed=$((ADDITIONS + DELETIONS))
          if [ "$changed" -gt 400 ]; then
            echo "::warning title=PR size::${changed} changed lines (limit about 400). Split it by ticket if you can."
          fi
