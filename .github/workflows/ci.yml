name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; a job that needs more must declare its own
# job-level `permissions:` override.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            admin:
              - 'apps/admin/**'
              - 'packages/engine/**'
            mobile:
              - 'apps/mobile/**'
            supabase:
              - 'supabase/**'

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: node .claude/hooks/bin/scratch-expiry.mjs

  admin-e2e:
    name: admin-e2e
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @credit-coach/admin exec playwright install --with-deps chromium
      - run: pnpm --filter @credit-coach/admin test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      # --ignore-scripts: an audited dependency's install script never runs here.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=high
      - name: OSV-Scanner (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml
            --config=./osv-scanner.toml

  sonar:
    name: sonar
    runs-on: ubuntu-latest
    env:
      # A boolean gate, not the token itself: job-scoped env is visible to
      # every step, including `pnpm install` lifecycle scripts and the engine
      # test run, neither of which has any business seeing SONAR_TOKEN.
      HAS_SONAR: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - if: env.HAS_SONAR == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: env.HAS_SONAR == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: env.HAS_SONAR == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - if: env.HAS_SONAR == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_SONAR == 'true'
        run: pnpm --filter @credit-coach/engine test
      - if: env.HAS_SONAR == 'true'
        name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # SONAR_REQUIRED is a repository variable the owner sets to 'true' once
      # the token exists; until then a missing token only skips Sonar.
      - if: env.HAS_SONAR != 'true' && vars.SONAR_REQUIRED == 'true'
        run: |
          echo "::error::Sonar is required (SONAR_REQUIRED=true) but SONAR_TOKEN is not set"
          exit 1
      - if: env.HAS_SONAR != 'true' && vars.SONAR_REQUIRED != 'true'
        run: |
          echo "::warning::Sonar skipped: SONAR_TOKEN not set"

  maestro-evidence:
    name: maestro-evidence
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The PR head, not the ephemeral merge commit: otherwise a PR that
          # touches apps/mobile makes the merge commit itself "the last
          # mobile change" and the ancestry check can never be satisfied.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node .claude/hooks/bin/maestro-evidence.mjs
